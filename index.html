<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farāid Calculator | ഫറാഇദ് കാൽക്കുലേറ്റർ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- High-quality professional font stack -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@300;400;500;600;700;800&family=Noto+Sans+Malayalam:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #006B46;
      --secondary: #1E2E4F;
      --accent: #D89F37;
      --bg: #F0F4F0;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden !important;
      position: fixed;
      /* Optimized UI font stack */
      font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', 'Noto Sans Malayalam', 'Noto Sans Tamil', sans-serif;
      background-color: var(--bg);
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "kern" 1;
    }

    /* Elegant Islamic Geometric Pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0l20 20-20 20-20-20zM0 40l20 20-20 20-20-20zM80 40l20 20-20 20-20-20zM40 80l20 20-20 20-20-20z' fill='%23006b46' fill-opacity='0.025' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .hide-scrollbar {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none !important;
    }

    /* Modern Arabic UI Style */
    .arabic {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1.6;
      font-size: 1.05em; /* Optical scaling for Arabic */
    }

    /* Classical Arabic Display Text (Quran/Hadith) */
    .arabic-display {
      font-family: 'Scheherazade New', 'Amiri', serif;
      direction: rtl !important;
      text-align: center !important;
      font-size: 2.25rem !important; /* Larger and distinct */
      line-height: 2.2 !important; /* High vertical rhythm for harakat */
      font-weight: 500 !important;
      unicode-bidi: isolate;
      color: var(--secondary);
      /* Professional typographic ligatures and tashkeel support */
      font-feature-settings: "liga" 1, "dlig" 1, "kern" 1;
      word-wrap: normal;
      overflow-wrap: normal;
      white-space: normal;
      text-rendering: optimizeLegibility;
    }
    
    .malayalam {
      font-family: 'Noto Sans Malayalam', sans-serif;
      letter-spacing: -0.01em;
      line-height: 1.7;
      font-size: 0.95em;
    }

    .tamil {
      font-family: 'Noto Sans Tamil', sans-serif;
      line-height: 1.6;
    }

    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
    }

    .glass-navy {
      background: linear-gradient(135deg, rgba(30, 46, 79, 0.98), rgba(30, 46, 79, 0.88));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
    }

    .active-press:active {
      transform: scale(0.97);
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-in {
      animation: fadeInScale 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Safe Area Padding Utilities */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
    
    /* Input aesthetics */
    input::placeholder {
      color: rgba(30, 46, 79, 0.2);
    }
  </style>
